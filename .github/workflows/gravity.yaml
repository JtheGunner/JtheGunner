name: Contribution gravity

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  gravity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate light-mode title
        uses: flycran/github-gravity@v1
        with:
          username: JtheGunner
          text: "01001010 01100101 01100110"
          text-color: black
          font-size: 56
          text-top: 30
          output-path: deploy/title-light.svg

      - name: Render second binary row (light)
        uses: flycran/github-gravity@v1
        with:
          username: JtheGunner
          text: "01100110 01110010 01111001"
          text-color: black
          font-size: 56
          text-top: 30
          output-path: row2-light.svg

      - name: Combine binary rows (light)
        run: python3 .github/scripts/binary-title.py deploy/title-light.svg row2-light.svg light

      - name: Generate dark-mode title
        uses: flycran/github-gravity@v1
        with:
          username: JtheGunner
          text: "01001010 01100101 01100110"
          text-color: white
          font-size: 56
          text-top: 30
          output-path: deploy/title-dark.svg

      - name: Render second binary row (dark)
        uses: flycran/github-gravity@v1
        with:
          username: JtheGunner
          text: "01100110 01110010 01111001"
          text-color: white
          font-size: 56
          text-top: 30
          output-path: row2-dark.svg

      - name: Combine binary rows (dark)
        run: python3 .github/scripts/binary-title.py deploy/title-dark.svg row2-dark.svg dark

      - name: Publish to the output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: output
          keep_files: false
          force_orphan: true
