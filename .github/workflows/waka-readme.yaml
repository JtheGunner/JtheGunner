name: Waka README

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  waka-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          API_BASE_URL: https://wakapi.xn--wrm-hoa.li/api
          SECTION_NAME: waka
          TIME_RANGE: last_30_days
          LANG_COUNT: 6
          SHOW_TITLE: false
          SHOW_TIME: true
          SHOW_TOTAL: false
          BLOCKS: "░▒▓█"
          COMMIT_MESSAGE: "chore: update language stats"
