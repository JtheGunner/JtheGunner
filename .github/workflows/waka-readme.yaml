name: Waka README

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

jobs:
  waka-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: athul/waka-readme@8991b596d85696d98ea96f775390a1bbe266c8c9 # master, 2026-10-23
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          API_BASE_URL: https://wakapi.xn--wrm-hoa.li/api
          SECTION_NAME: waka
          TIME_RANGE: last_30_days
          LANG_COUNT: 6
          SHOW_TITLE: false
          SHOW_TIME: true
          SHOW_TOTAL: false
          BLOCKS: "░▒▓█"
          COMMIT_MESSAGE: "chore: update language stats"
